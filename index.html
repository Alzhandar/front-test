    <link rel="stylesheet" crossorigin href="/assets/index-jlEgkrWH.css">
    <style>
      .open-hint{
        position:absolute;
        top:63.5%;
        left:50%;
        transform:translate(-50%,-50%);
        z-index:7;
        width:clamp(146px,41vw,176px);
        height:clamp(146px,41vw,176px);
        pointer-events:none;
      }
      .open-hint__ring{
        position:absolute;
        inset:0;
        border-radius:50%;
        border:2px solid #f3d595;
        opacity:0;
        animation:open-hint-ring 2.4s ease-out infinite;
      }
      .open-hint__ring:nth-child(2){ animation-delay:.8s; }
      .open-hint__ring:nth-child(3){ animation-delay:1.6s; }
      @keyframes open-hint-ring{
        0%{transform:scale(.8);opacity:.8}
        70%{opacity:.18}
        100%{transform:scale(1.16);opacity:0}
      }
      .door--open .open-hint{display:none}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){
        function addHint(){
          var doorBtn = document.querySelector('.door');
          if(!doorBtn){ return false; }
          if(doorBtn.querySelector('.open-hint')){ return true; }
          var hint = document.createElement('span');
          hint.className = 'open-hint';
          hint.setAttribute('aria-hidden', 'true');
          hint.innerHTML = '<span class="open-hint__ring"></span><span class="open-hint__ring"></span><span class="open-hint__ring"></span>';
          doorBtn.appendChild(hint);
          return true;
        }
        var tries = 0;
        var timer = setInterval(function(){
          tries++;
          if(addHint() || tries > 100){ clearInterval(timer); }
        }, 100);
      })();
    </script>
  </body>
